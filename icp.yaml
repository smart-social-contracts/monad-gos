# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.1.0/docs/schemas/icp-yaml-schema.json
#
# Monad GOS — icp-cli project (dfx is not used).

networks:
  - name: local
    mode: managed
    gateway:
      port: 8100

canisters:
  - name: monad_backend
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: src/monad_backend/main.mo
        candid: monad_backend.did

  - name: monad_frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.0"
      configuration:
        dir: dist
